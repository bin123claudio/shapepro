name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        run: |
          mkdir projeto
          unzip -q "shapepro_android_project (1).zip" -d projeto
          echo "Conteúdo:"
          find projeto -maxdepth 3 -type f | head -100

      - name: Encontrar Gradle
        run: |
          GRADLEW=$(find projeto -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew não encontrado"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "Gradle encontrado em: $GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: '**/build/outputs/apk/**/*.apk'
